project_name: "sam3_auto_annotation_lab"

dataset_path: "./data/images"
output_path: "./data/annotations_final"

label_schema:
  - person
  - car
  - dog

sam3:
  model_name: "sam3_b"
  backend: "hf_local"  # options: mock | sam3_api | hf_local
  allow_mock_fallback: true
  # sam3_api options
  api_url: ""      # set when backend is sam3_api
  api_key_env: "SAM3_API_KEY"
  api_timeout_s: 60
  # hf_local options (real SAM3 via transformers)
  hf_repo_id: "facebook/sam3"
  local_dir: "./models/sam3"
  device: "auto"                # auto | cuda | cpu
  hf_score_threshold: 0.4
  text_prompt_mode: true

qa:
  max_retries: 2
  min_mask_area: 0.001
  max_mask_area: 0.5
  iou_threshold: 0.7
  confidence_threshold: 0.3
  enable_captioning: false
  # true = flag any image missing a class from label_schema. Only useful when
  # every image really is expected to contain every class.
  require_all_classes: false

llm:
  model_name: "mock-llm"

human_review:
  enabled: true
  max_retries: 2

# Orchestrator tuning
max_turns_per_bundle: 25
max_workers: 1  # >1 enables parallel per-image processing (useful for sam3_api backend)
yolo_segmentation: true  # true = YOLO-seg polygon format, false = YOLO bbox

